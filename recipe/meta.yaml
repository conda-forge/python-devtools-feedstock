{% set condaforge_name = "python-devtools" %}
{% set pypi_name = "devtools" %}
{% set version = "0.12.2" %}


package:
  name: {{ condaforge_name }}
  version: {{ version }}

source:
  url: https://pypi.org/packages/source/{{ pypi_name[0] }}/{{ pypi_name }}/devtools-{{ version }}.tar.gz
  sha256: efceab184cb35e3a11fa8e602cc4fadacaa2e859e920fc6f87bf130b69885507

build:
  number: 1
  noarch: python
  script: {{ PYTHON }} -m pip install . -vv

requirements:
  host:
    - pip
    - python {{ python_min }}
    - hatchling
  run:
    - python >={{ python_min }}
    - executing >=1.1.1
    - asttokens >=2.0.0,<3.0.0
    - pygments >=2.15.0

test:
  imports:
    - devtools
  commands:
    - pip check
  requires:
    - pip
    - python {{ python_min }}

about:
  home: https://github.com/samuelcolvin/python-devtools
  summary: Python's missing debug print command and other development tools.
  license: MIT
  license_file: LICENSE

extra:
  recipe-maintainers:
    - maresb
